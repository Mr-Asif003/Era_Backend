server:
  port: ${PORT:8080}
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: era-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: ${SPRING_DATA_MONGODB_DATABASE:eradb}

  lifecycle:
    timeout-per-shutdown-phase: 20s

jwt:
  secret: ${JWT_SECRET}
  access-expiry: ${JWT_ACCESS_EXPIRY:900000}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:604800000}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /docs

  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    path: /swagger-ui

logging:
  level:
    root: INFO
    com.era: INFO
    org.springframework.websocket: INFO
    org.springframework.messaging: INFO

server.shutdown: graceful