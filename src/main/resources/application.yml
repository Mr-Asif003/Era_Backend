server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: era-backend

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}
      database: eradb

jwt:
  secret: ${JWT_SECRET:ZXJhX2p3dF9zZWNyZXRfbWluaW11bV8yNTZfYml0c19sb25nX2NoYW5nZV9pbl9wcm9k}
  access-expiry: ${JWT_ACCESS_EXPIRY:900000}
  refresh-expiry: ${JWT_REFRESH_EXPIRY:604800000}

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui

logging:
  level:
    com.era: DEBUG
    org.springframework.websocket: INFO
    org.springframework.messaging: INFO